[common]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[rfid2_common]
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    https://github.com/kkloesener/MFRC522_I2C.git
build_src_filter = +<main.cpp>

[probe_common]
lib_deps =
    m5stack/M5Unified @ ^0.2.0
build_src_filter = +<serial_probe.cpp>

[jtag_probe_common]
lib_deps =
    m5stack/M5Unified @ ^0.2.0
build_src_filter = +<jtag_probe.cpp>

[jtag_min_common]
build_src_filter = +<jtag_min.cpp>

[env:cardputer-adv-rfid2]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${rfid2_common.lib_deps}
build_src_filter = ${rfid2_common.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESP32S3
    -DCARDPUTER_ADV
    -DM5GFX_BOARD=board_M5CardputerADV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:cardputer-adv-rfid2-tinyusb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${rfid2_common.lib_deps}
build_src_filter = ${rfid2_common.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESP32S3
    -DCARDPUTER_ADV
    -DM5GFX_BOARD=board_M5CardputerADV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0

[env:cardputer-adv-serial-probe]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
