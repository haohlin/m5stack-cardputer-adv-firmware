[common]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[rfid2_common]
lib_deps =
    ; M5Unified from the PlatformIO registry. ^0.2.0 currently resolves to 0.2.17.
    ; M5Stack's RFID2 guide requires M5Unified >= 0.2.8, so this is safe.
    ; M5GFX is pulled in transitively by M5Unified (guide requires >= 0.2.11).
    ; Pin to an exact version for reproducibility:
    m5stack/M5Unified @ 0.2.17        ; was ^0.2.0; pinned for reproducible builds (>=0.2.8 required by M5)

    ; M5Cardputer board support, pinned to a specific commit. (PlatformIO names a
    ; VCS dependency with "name=url", not "@"; the # fragment pins the commit.)
    M5Cardputer=https://github.com/m5stack/M5Cardputer.git#e0232804763d3e42d7e9be90e43cf6e1c9e7565b

    ; RFID2 driver. This kkloesener fork is the library M5Stack's OFFICIAL
    ; Unit RFID/RFID2 Arduino guide tells you to install (via this exact GitHub URL).
    ; Do NOT switch to arozcan's upstream or any other fork. Pinned to a commit:
    MFRC522_I2C=https://github.com/kkloesener/MFRC522_I2C.git#8152dddc93cf743397ac225e34bf268698326664
build_src_filter = +<main.cpp>

[probe_common]
lib_deps =
    m5stack/M5Unified @ ^0.2.0
build_src_filter = +<serial_probe.cpp>

[jtag_probe_common]
lib_deps =
    m5stack/M5Unified @ ^0.2.0
build_src_filter = +<jtag_probe.cpp>

[jtag_min_common]
build_src_filter = +<jtag_min.cpp>

[env:cardputer-adv-rfid2]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.partitions = ../../contracts/launcher/cardputer-adv-8mb.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${rfid2_common.lib_deps}
build_src_filter = ${rfid2_common.build_src_filter}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESP32S3
    -DCARDPUTER_ADV
    -DM5GFX_BOARD=board_M5CardputerADV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:cardputer-adv-rfid2-tinyusb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
